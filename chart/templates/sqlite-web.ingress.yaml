apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: salat-ingress-sqlite-web
spec:
  rules:
    - host: {{ .Values.sqlite_web.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sqlite-web
                port:
                  number: 8080
